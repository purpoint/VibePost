<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070d1a" />
    <meta name="description" content="VibePost — Share. Connect. Engage." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>VibePost — Share. Connect. Engage.</title>
  </head>
  <body>
    <script>
      // Runs before React mounts: a stored choice wins, otherwise follow the
      // operating system. Without this the page paints dark, then corrects
      // itself, which is visible as a flash.
      (function () {
        try {
          var stored = localStorage.getItem('vibepost.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
